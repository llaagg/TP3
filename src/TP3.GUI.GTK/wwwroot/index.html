    <div id="blazor-error-ui" class="alert alert-danger w-50 align-content-center" role="alert" data-nosnippet>
        Guru Meditation

        <br />
        <a href="" class="reload" target="_self">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-bootstrap-reboot" viewBox="0 0 16 16">

    <script src="_framework/blazor.webview.js" ></script>
    <script src="_content/Revuo.Chat.Client.Components/js/bootstrap.bundle.min.js"></script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="_content/Revuo.Chat.Client.Components/googleSignInInterop.js"></script>
    
    <script>
        const showGuruNote = (message, showNoBlazor) => {
            const panel = document.getElementById('blazor-error-ui');
            const note = document.getElementById('blazor-status-note');
            const label = document.getElementById('no-blazor-id');

            if (panel) {
                panel.style.display = 'block';
            }

            if (note) {
                note.textContent = message || '';
                note.style.display = message ? 'block' : 'none';
            }

            if (label) {
                label.style.display = showNoBlazor ? 'block' : 'none';
            }
        };

        window.addEventListener('DOMContentLoaded', function () {
            if (typeof Blazor === 'undefined') {
                console.error('Blazor is not defined after script load');
                showGuruNote('Blazor scripts failed to start. Update Android System WebView or Chrome and try again.', true);
            }
        });

        window.addEventListener('error', function (e) {
            const message = e && e.message ? e.message : 'A JavaScript error stopped the UI.';
            console.error('JavaScript error:', e && e.error ? e.error : e);
            const isSyntaxRelated = message.toLowerCase().includes('unexpected token');
            const note = isSyntaxRelated
                ? 'Your Android WebView looks outdated. Update Android System WebView or Chrome to fix this.'
                : message;
            showGuruNote(note, true);
        });
    </script>
   
</body>
