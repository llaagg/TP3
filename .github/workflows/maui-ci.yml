name: Build All Apps

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

env:
  DOTNET_VERSION: 10.0.x

jobs:
  build-cli-server-gtk:
    name: Build CLI, Server, GTK (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore src/TP3.WithGUI.slnx

      - name: Build CLI
        run: dotnet build src/TP3.CLI/TP3.CLI.csproj -c Release --no-restore

      - name: Build Server
        run: dotnet build src/TP3.Server/TP3.Server.csproj -c Release --no-restore

      - name: Build GTK
        run: dotnet build src/TP3.GUI.GTK/TP3.GUI.GTK.csproj -c Release --no-restore

  build-maui-windows:
    name: Build MAUI Desktop (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Restore MAUI (Windows target)
        run: dotnet restore src/TP3.GUI.Maui/TP3.GUI.Maui.csproj -p:TargetFramework=net10.0-windows10.0.19041.0 -r win-x64

      - name: Build MAUI (Windows target)
        run: dotnet build src/TP3.GUI.Maui/TP3.GUI.Maui.csproj -f net10.0-windows10.0.19041.0 -c Release --no-restore

  build-maui-android:
    name: Build MAUI Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore solution dependencies
        run: dotnet restore src/TP3.slnx

      - name: Restore MAUI (Android target)
        run: dotnet restore src/TP3.GUI.Maui/TP3.GUI.Maui.csproj -p:TargetFramework=net10.0-android

      - name: Build MAUI (Android target)
        run: dotnet build src/TP3.GUI.Maui/TP3.GUI.Maui.csproj -f net10.0-android -c Release --no-restore

  build-maui-ios:
    name: Build MAUI iPhone (iOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Restore solution dependencies
        run: dotnet restore src/TP3.slnx

      - name: Restore MAUI (iOS target)
        run: dotnet restore src/TP3.GUI.Maui/TP3.GUI.Maui.csproj -p:TargetFramework=net10.0-ios

      - name: Build MAUI (iOS simulator)
        run: dotnet build src/TP3.GUI.Maui/TP3.GUI.Maui.csproj -f net10.0-ios -c Release -p:RuntimeIdentifier=iossimulator-arm64 -p:BuildIpa=false --no-restore
