name: MAUI CI - Android only

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android SDK (packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless unzip
          # sdkmanager is available via Android SDK; attempt install but tolerate failures
          yes | sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Cache NuGet packages and workloadpacks
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/workloadpacks
          key: ${{ runner.os }}-dotnet-workloads-${{ hashFiles('src/TP3.slnx') }}

      - name: Install MAUI workloads for Android
        run: |
          set -e
          cd src
          dotnet --info
          dotnet workload restore
          # retry installs to reduce flakiness
          for i in 1 2 3; do
            dotnet workload install maui-android && break || {
              echo "maui-android install failed, retrying ($i)";
              sleep $((i * 5));
            }
          done || true

      - name: Restore for Android only
        run: |
          cd src
          dotnet restore TP3.Maui.Client/TP3.Maui.Client.csproj -p:TargetFramework=net10.0-android

      - name: Build Android
        run: |
          cd src
          dotnet build TP3.Maui.Client/TP3.Maui.Client.csproj -f net10.0-android -c Release --no-restore
